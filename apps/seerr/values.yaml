# Seerr (media requests). Logs in through Jellyfin (jellyflix.home); talks to
# Sonarr/Radarr through their unauthenticated /api routes on arr.autostack.ovh.
# Data (SQLite + settings.json) migrated from Tools /docker/volumes/seer.
controllers:
  seerr:
    containers:
      app:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.2
        env:
          TZ: Europe/Brussels
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {memory: 768Mi}
        probes:
          liveness: &probe {enabled: true, type: HTTP, path: /api/v1/status}
          readiness: *probe

defaultPodOptions:
  # The image runs as node (1000); data on Tools is owned by 1000
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: seerr
    ports:
      http:
        port: 5055

ingress:
  app:
    className: traefik
    hosts:
      - host: seer.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/config
