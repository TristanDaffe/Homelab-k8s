# Paperless-ngx with its helpers, migrated from the "other" compose stack on
# Media: Redis (task queue only, no persistence), Gotenberg and Tika (document
# conversion). Services are named like the compose services.
# Database on the Postgres HA cluster (floating IP .140, database/user
# paperless, created by the Homelab-infra postgresql-ha role).
# Files migrated from Media /docker/volumes/paperless/{data,media,consume,export}.
# Login through Pocket ID (allauth; OIDC client in Infisical /paperless).
controllers:
  paperless:
    containers:
      app:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.5.1
        env:
          PAPERLESS_REDIS: redis://redis:6379
          PAPERLESS_DBENGINE: postgresql
          PAPERLESS_DBHOST: 192.168.129.140
          PAPERLESS_DBNAME: paperless
          PAPERLESS_DBUSER: paperless
          PAPERLESS_TIKA_ENABLED: "1"
          PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
          PAPERLESS_TIKA_ENDPOINT: http://tika:9998
          PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
          PAPERLESS_URL: https://paper.autostack.ovh
          # Also the in-cluster name, for Homepage's widget (Django rejects other Hosts)
          PAPERLESS_ALLOWED_HOSTS: paper.autostack.ovh,paperless.paperless.svc.cluster.local
          PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
          PAPERLESS_SECURE_PROXY_SSL_HEADER: HTTP_X_FORWARDED_PROTO,https
          PAPERLESS_USE_X_FORWARDED_HOST: "true"
          PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paper.autostack.ovh
          PAPERLESS_CSRF_COOKIE_SECURE: "true"
          PAPERLESS_SESSION_COOKIE_SECURE: "true"
          PAPERLESS_TIME_ZONE: Europe/Brussels
        envFrom:
          - secretRef:
              name: paperless
        resources:
          requests: {cpu: 50m, memory: 512Mi}
          limits: {memory: 2Gi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}
          # First start after the migration may run database migrations
          startup:
            enabled: true
            spec: {failureThreshold: 60, periodSeconds: 10}

  redis:
    containers:
      app:
        image:
          repository: docker.io/library/redis
          tag: "8"
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

  gotenberg:
    containers:
      app:
        image:
          repository: docker.io/gotenberg/gotenberg
          tag: "9.8"
        # No JavaScript or external content when converting .eml files
        args:
          - gotenberg
          - --chromium-disable-javascript=true
          - --chromium-allow-list=file:///tmp/.*
        resources:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 1Gi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

  tika:
    containers:
      app:
        image:
          repository: docker.io/apache/tika
          tag: 4.2.0
        resources:
          requests: {cpu: 10m, memory: 256Mi}
          limits: {memory: 1Gi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

service:
  paperless:
    forceRename: paperless
    controller: paperless
    ports:
      http: {port: 8000}
  redis:
    forceRename: redis
    controller: redis
    ports:
      redis: {port: 6379}
  gotenberg:
    forceRename: gotenberg
    controller: gotenberg
    ports:
      http: {port: 3000}
  tika:
    forceRename: tika
    controller: tika
    ports:
      http: {port: 9998}

ingress:
  app:
    className: traefik
    hosts:
      - host: paper.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: paperless
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      paperless:
        app: [{path: /usr/src/paperless/data}]
  media:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      paperless:
        app: [{path: /usr/src/paperless/media}]
  consume:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      paperless:
        app: [{path: /usr/src/paperless/consume}]
  export:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      paperless:
        app: [{path: /usr/src/paperless/export}]

# Secrets from Infisical /paperless; the OIDC provider JSON is built from the
# client ID and secret (ExternalSecret template, merged with the plain keys)
externalSecrets:
  app:
    forceRename: paperless
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: paperless
      template:
        engineVersion: v2
        mergePolicy: Merge
        data:
          PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket-ID","client_id":"{{ .SSO_CLIENT_ID }}","secret":"{{ .SSO_CLIENT_SECRET }}","settings":{"server_url":"https://pocket-id.autostack.ovh"}}]}}'
    data:
      - secretKey: PAPERLESS_DBPASS
        remoteRef:
          key: /paperless/PAPERLESS_DBPASS
      - secretKey: PAPERLESS_ADMIN_USER
        remoteRef:
          key: /paperless/PAPERLESS_ADMIN_USER
      - secretKey: PAPERLESS_ADMIN_PASSWORD
        remoteRef:
          key: /paperless/PAPERLESS_ADMIN_PASSWORD
      - secretKey: PAPERLESS_SECRET_KEY
        remoteRef:
          key: /paperless/PAPERLESS_SECRET_KEY
      - secretKey: SSO_CLIENT_ID
        remoteRef:
          key: /paperless/SSO_CLIENT_ID
      - secretKey: SSO_CLIENT_SECRET
        remoteRef:
          key: /paperless/SSO_CLIENT_SECRET
