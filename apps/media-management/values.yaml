# Media management stack, migrated from the media-management compose stack on
# Tools: Sonarr, Radarr, Prowlarr, Bazarr, qBittorrent and a FlareSolverr for
# Prowlarr and Shelfmark, plus Shelfmark x2 (book downloads).
# One namespace with Services named like the compose services, so the
# connections saved inside the apps (qbittorrent:8080, prowlarr:9696,
# sonarr:8989, radarr:7878, flaresolverr:8191) keep working unchanged.
# Configs (SQLite) on Longhorn; media on the NAS through one nas-media volume,
# mounted at the same paths as on Tools.
# Web UIs: arr.autostack.ovh/<app> and qbit.autostack.ovh behind
# TinyAuth; the *arr /api paths stay open (they require an API key).

controllers:
  sonarr:
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/sonarr
          tag: 4.0.20
        # Shared by the linuxserver images below
        env: &lsio-env
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Brussels
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
        probes: &tcp-probes
          liveness: {enabled: true}
          readiness: {enabled: true}

  radarr:
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/radarr
          tag: 7.0.3
        env: *lsio-env
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
        probes: *tcp-probes

  prowlarr:
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/prowlarr
          tag: 3.1.0
        env: *lsio-env
        resources:
          requests: {cpu: 20m, memory: 128Mi}
          limits: {memory: 512Mi}
        probes: *tcp-probes

  bazarr:
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/bazarr
          tag: 1.6.2
        env: *lsio-env
        resources:
          requests: {cpu: 20m, memory: 128Mi}
          limits: {memory: 512Mi}
        probes: *tcp-probes

  qbittorrent:
    containers:
      app:
        image:
          repository: ghcr.io/linuxserver/qbittorrent
          tag: 20.04.1
        env:
          <<: *lsio-env
          WEBUI_PORT: "8080"
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
        probes: *tcp-probes

  flaresolverr:
    containers:
      app:
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.2
        env:
          LOG_LEVEL: info
          TZ: Europe/Brussels
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {memory: 1Gi}
        probes: *tcp-probes

  # Shelfmark (book downloads into the NAS books folders, picked up by
  # Calibre-Web on Media); the first one uses FlareSolverr as on Tools
  shelfmark:
    containers:
      app:
        image:
          repository: ghcr.io/calibrain/shelfmark
          tag: v1.7.2
        env:
          FLASK_PORT: "8084"
          LOG_LEVEL: info
          USE_BOOK_TITLE: "true"
          TZ: Europe/Brussels
          APP_ENV: prod
          UID: "1000"
          GID: "1000"
          CUSTOM_DNS: google
          USE_DOH: "true"
          BOOK_LANGUAGE: fr,en
          USE_CF_BYPASS: "true"
          EXT_BYPASSER_URL: http://flaresolverr:8191
          PRIORITIZE_WELIB: "True"
        # Starts its own Chrome to get past Cloudflare: 512Mi was OOM-killed
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {memory: 2Gi}
        # Several minutes before it opens its port on first start
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}
          startup:
            enabled: true
            spec: {failureThreshold: 30, periodSeconds: 10}

  shelfmark-maman:
    containers:
      app:
        image:
          repository: ghcr.io/calibrain/shelfmark
          tag: v1.7.2
        env:
          FLASK_PORT: "8084"
          LOG_LEVEL: info
          USE_BOOK_TITLE: "true"
          TZ: Europe/Brussels
          APP_ENV: prod
          UID: "1000"
          GID: "1000"
          CUSTOM_DNS: google
          USE_DOH: "true"
          BOOK_LANGUAGE: fr
        # Starts its own Chrome to get past Cloudflare: 512Mi was OOM-killed
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {memory: 2Gi}
        # Several minutes before it opens its port on first start
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}
          startup:
            enabled: true
            spec: {failureThreshold: 30, periodSeconds: 10}

service:
  sonarr:
    forceRename: sonarr
    controller: sonarr
    ports:
      http: {port: 8989}
  radarr:
    forceRename: radarr
    controller: radarr
    ports:
      http: {port: 7878}
  prowlarr:
    forceRename: prowlarr
    controller: prowlarr
    ports:
      http: {port: 9696}
  bazarr:
    forceRename: bazarr
    controller: bazarr
    ports:
      http: {port: 6767}
  qbittorrent:
    forceRename: qbittorrent
    controller: qbittorrent
    ports:
      http: {port: 8080}
  shelfmark:
    forceRename: shelfmark
    controller: shelfmark
    ports:
      http: {port: 8084}
  shelfmark-maman:
    forceRename: shelfmark-maman
    controller: shelfmark-maman
    ports:
      http: {port: 8084}
  flaresolverr:
    forceRename: flaresolverr
    controller: flaresolverr
    ports:
      http: {port: 8191}

# Each web UI behind TinyAuth, plus its /api path without login (the longer
# path wins in Traefik), as on Tools
ingress:
  sonarr:
    className: traefik
    annotations: &tinyauth
      traefik.ingress.kubernetes.io/router.middlewares: tinyauth-media-forwardauth@kubernetescrd
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /sonarr, pathType: Prefix, service: {identifier: sonarr, port: http}}
  sonarr-api:
    className: traefik
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /sonarr/api, pathType: Prefix, service: {identifier: sonarr, port: http}}
  radarr:
    className: traefik
    annotations: *tinyauth
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /radarr, pathType: Prefix, service: {identifier: radarr, port: http}}
  radarr-api:
    className: traefik
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /radarr/api, pathType: Prefix, service: {identifier: radarr, port: http}}
  prowlarr:
    className: traefik
    annotations: *tinyauth
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /prowlarr, pathType: Prefix, service: {identifier: prowlarr, port: http}}
  prowlarr-api:
    className: traefik
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /prowlarr/api, pathType: Prefix, service: {identifier: prowlarr, port: http}}
  bazarr:
    className: traefik
    annotations: *tinyauth
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /bazarr, pathType: Prefix, service: {identifier: bazarr, port: http}}
  bazarr-api:
    className: traefik
    hosts:
      - host: arr.autostack.ovh
        paths:
          - {path: /bazarr/api, pathType: Prefix, service: {identifier: bazarr, port: http}}
  # No open /api route here: qBittorrent's own login is bypassed for every
  # address (AuthSubnetWhitelist 0.0.0.0/0), so its API stays behind TinyAuth.
  # In-cluster clients (Sonarr, Radarr, Homepage) use qbittorrent:8080.
  qbittorrent:
    className: traefik
    annotations: *tinyauth
    hosts:
      - host: qbit.autostack.ovh
        paths:
          - {path: /, pathType: Prefix, service: {identifier: qbittorrent, port: http}}
  # No login, as on Tools
  shelfmark:
    className: traefik
    hosts:
      - host: shelfmark.autostack.ovh
        paths:
          - {path: /, pathType: Prefix, service: {identifier: shelfmark, port: http}}
  shelfmark-maman:
    className: traefik
    hosts:
      - host: shelfmark-maman.autostack.ovh
        paths:
          - {path: /, pathType: Prefix, service: {identifier: shelfmark-maman, port: http}}

persistence:
  sonarr-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      sonarr:
        app: [{path: /config}]
  radarr-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      radarr:
        app: [{path: /config}]
  prowlarr-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      prowlarr:
        app: [{path: /config}]
  bazarr-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      bazarr:
        app: [{path: /config}]
  qbittorrent-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      qbittorrent:
        app: [{path: /config}]
  shelfmark-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      shelfmark:
        app: [{path: /config}]
  shelfmark-maman-config:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      shelfmark-maman:
        app: [{path: /config}]
  # NAS folder mac-mini (same as Tools' /media); same container paths as Tools
  media:
    type: persistentVolumeClaim
    storageClass: nas-media
    accessMode: ReadWriteMany
    size: 1Ti
    advancedMounts:
      sonarr:
        app:
          - {path: /downloads, subPath: media/downloads}
          - {path: /tv, subPath: media/tvseries}
      radarr:
        app:
          - {path: /downloads, subPath: media/downloads}
          - {path: /movies, subPath: media/movies}
      bazarr:
        app:
          - {path: /movies, subPath: media/movies}
          - {path: /tv, subPath: media/tvseries}
      qbittorrent:
        app:
          - {path: /downloads, subPath: media/downloads}
      shelfmark:
        app:
          - {path: /books, subPath: books/downloads}
      shelfmark-maman:
        app:
          - {path: /books, subPath: books-maman/downloads}
