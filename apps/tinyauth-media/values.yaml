# TinyAuth for the "media" group: Traefik forwardAuth in front of cluster apps,
# logging in through Pocket ID on Master. Same OIDC client as Master's
# tinyauth-media (both callback URLs registered in Pocket ID).
# Protect an app with the Ingress annotation
#   traefik.ingress.kubernetes.io/router.middlewares: tinyauth-media-forwardauth@kubernetescrd
# Sessions live in memory, as on Master: a pod restart means logging in again.
controllers:
  tinyauth-media:
    containers:
      app:
        image:
          repository: ghcr.io/tinyauthapp/tinyauth
          tag: v5.2.0
        env:
          TINYAUTH_APPURL: https://auth-media.kube.autostack.ovh
          TINYAUTH_UI_TITLE: TinyAuth - media
          TINYAUTH_DATABASE_DRIVER: memory
          # No per-app ACLs: the kubernetes provider would need RBAC to watch Ingresses
          TINYAUTH_LABELPROVIDER: none
          TINYAUTH_AUTH_SECURECOOKIE: "true"
          # Pod network: requests come from Traefik pods
          TINYAUTH_AUTH_TRUSTEDPROXIES: 10.42.0.0/16
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_AUTHURL: https://pocket-id.autostack.ovh/authorize
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_TOKENURL: https://pocket-id.autostack.ovh/api/oidc/token
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_USERINFOURL: https://pocket-id.autostack.ovh/api/oidc/userinfo
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_REDIRECTURL: https://auth-media.kube.autostack.ovh/api/oauth/callback/pocketid
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_SCOPES: openid email profile groups
          TINYAUTH_OAUTH_PROVIDERS_POCKETID_NAME: Pocket ID
          TINYAUTH_OAUTH_AUTOREDIRECT: pocketid
        envFrom:
          - secretRef:
              name: tinyauth-media-oidc
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        probes:
          liveness: &probe {enabled: true, type: HTTP, path: /api/healthz}
          readiness: *probe

service:
  app:
    controller: tinyauth-media
    ports:
      http:
        port: 3000

ingress:
  app:
    className: traefik
    hosts:
      - host: auth-media.kube.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

# Pocket ID client of the media group (Infisical folder /tinyauth-media)
externalSecrets:
  oidc:
    forceRename: tinyauth-media-oidc
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: tinyauth-media-oidc
    data:
      - secretKey: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTID
        remoteRef:
          key: /tinyauth-media/POCKETID_CLIENT_ID
      - secretKey: TINYAUTH_OAUTH_PROVIDERS_POCKETID_CLIENTSECRET
        remoteRef:
          key: /tinyauth-media/POCKETID_CLIENT_SECRET

rawResources:
  forwardauth:
    forceRename: forwardauth
    manifest:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      spec:
        forwardAuth:
          address: http://tinyauth-media.tinyauth-media.svc.cluster.local:3000/api/auth/traefik
