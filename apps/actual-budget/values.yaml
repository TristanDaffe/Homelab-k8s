# Actual Budget server. Its files (/data, SQLite + budget files) migrated from
# Media /docker/volumes/actual-budget. Login through Pocket ID (OIDC client in
# Infisical /actual-budget).
controllers:
  actual-budget:
    containers:
      app:
        image:
          repository: actualbudget/actual-server
          tag: 26.11.0
        env:
          ACTUAL_PORT: "5006"
          ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: "20"
          ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: "50"
          ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: "20"
          ACTUAL_OPENID_DISCOVERY_URL: https://pocket-id.autostack.ovh/.well-known/openid-configuration
          ACTUAL_OPENID_SERVER_HOSTNAME: https://budget.autostack.ovh
        envFrom:
          - secretRef:
              name: actual-budget
        resources:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 512Mi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

service:
  app:
    controller: actual-budget
    ports:
      http:
        port: 5006

ingress:
  app:
    className: traefik
    hosts:
      - host: budget.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data

externalSecrets:
  app:
    forceRename: actual-budget
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: actual-budget
    data:
      - secretKey: ACTUAL_OPENID_CLIENT_ID
        remoteRef:
          key: /actual-budget/ACTUAL_OPENID_CLIENT_ID
      - secretKey: ACTUAL_OPENID_CLIENT_SECRET
        remoteRef:
          key: /actual-budget/ACTUAL_OPENID_CLIENT_SECRET
