# Self-hosted Beeper bridge: bbctl downloads and runs mautrix-instagram, which
# connects outbound to Beeper's servers (no port, no Service, no Ingress).
# Never run two copies of the bridge: one replica, Recreate.
# State migrated from Tools /docker/volumes/beeper-instagram.
controllers:
  beeper:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/beeper/bridge-manager
          tag: latest@sha256:a7f564978d416f98f1fe680b49a5957f5e002303d2fd164cd7b1f8f3e20ba4d7
        args: [sh-instagram]
        env:
          TZ: Europe/Brussels
        envFrom:
          - secretRef:
              name: beeper
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 512Mi}
        probes:
          liveness: {enabled: false}
          readiness: {enabled: false}
          startup: {enabled: false}

defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data

externalSecrets:
  app:
    forceRename: beeper
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: beeper
    data:
      - secretKey: MATRIX_ACCESS_TOKEN
        remoteRef:
          key: /beeper/MATRIX_ACCESS_TOKEN
