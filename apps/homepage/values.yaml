# Homepage dashboard. Config files are static copies of the Ansible templates
# that rendered it on Master; widget credentials come from Infisical /homepage
# as HOMEPAGE_VAR_* environment variables, which Homepage substitutes into the
# files ({{HOMEPAGE_VAR_X}}) before parsing them.
global:
  # Keep app-template from evaluating Homepage's {{...}} placeholders
  templateEvaluation:
    excludePaths:
      - [configMaps, config, data]

controllers:
  homepage:
    containers:
      app:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.8.0
        env:
          TZ: Europe/Brussels
          HOMEPAGE_ALLOWED_HOSTS: home.autostack.ovh
        envFrom:
          - secretRef:
              name: homepage-widgets
        resources:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 384Mi}
        # TCP: an HTTP probe uses the pod IP as Host, which Homepage's host
        # validation (HOMEPAGE_ALLOWED_HOSTS) rejects with 400
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

service:
  app:
    controller: homepage
    ports:
      http:
        port: 3000

ingress:
  app:
    className: traefik
    hosts:
      - host: home.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  # Homepage writes logs and default files into /app/config
  config-dir:
    type: emptyDir
    globalMounts:
      - path: /app/config
  config:
    type: configMap
    identifier: config
    globalMounts:
      - {path: /app/config/settings.yaml, subPath: settings.yaml, readOnly: true}
      - {path: /app/config/services.yaml, subPath: services.yaml, readOnly: true}
      - {path: /app/config/bookmarks.yaml, subPath: bookmarks.yaml, readOnly: true}
      - {path: /app/config/widgets.yaml, subPath: widgets.yaml, readOnly: true}

externalSecrets:
  widgets:
    forceRename: homepage-widgets
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: homepage-widgets
    data:
      - secretKey: HOMEPAGE_VAR_BAZARR_API_KEY
        remoteRef:
          key: /homepage/BAZARR_API_KEY
      - secretKey: HOMEPAGE_VAR_CALIBRE_PASS
        remoteRef:
          key: /homepage/CALIBRE_PASS
      - secretKey: HOMEPAGE_VAR_CALIBRE_USER
        remoteRef:
          key: /homepage/CALIBRE_USER
      - secretKey: HOMEPAGE_VAR_IMMICH_API_KEY
        remoteRef:
          key: /homepage/IMMICH_API_KEY
      - secretKey: HOMEPAGE_VAR_JELLYFIN_API_KEY
        remoteRef:
          key: /homepage/JELLYFIN_API_KEY
      - secretKey: HOMEPAGE_VAR_MEALIE_API_KEY
        remoteRef:
          key: /homepage/MEALIE_API_KEY
      - secretKey: HOMEPAGE_VAR_NPM_PASS
        remoteRef:
          key: /homepage/NPM_PASS
      - secretKey: HOMEPAGE_VAR_NPM_USER
        remoteRef:
          key: /homepage/NPM_USER
      - secretKey: HOMEPAGE_VAR_PAPERLESS_TOKEN
        remoteRef:
          key: /homepage/PAPERLESS_TOKEN
      - secretKey: HOMEPAGE_VAR_PROWLARR_API_KEY
        remoteRef:
          key: /homepage/PROWLARR_API_KEY
      - secretKey: HOMEPAGE_VAR_QBIT_PASS
        remoteRef:
          key: /homepage/QBIT_PASS
      - secretKey: HOMEPAGE_VAR_QBIT_USER
        remoteRef:
          key: /homepage/QBIT_USER
      - secretKey: HOMEPAGE_VAR_RADARR_API_KEY
        remoteRef:
          key: /homepage/RADARR_API_KEY
      - secretKey: HOMEPAGE_VAR_SEERR_API_KEY
        remoteRef:
          key: /homepage/SEERR_API_KEY
      - secretKey: HOMEPAGE_VAR_SONARR_API_KEY
        remoteRef:
          key: /homepage/SONARR_API_KEY
      - secretKey: HOMEPAGE_VAR_SPEEDTEST_API_KEY
        remoteRef:
          key: /homepage/SPEEDTEST_API_KEY

configMaps:
  config:
    data:
      settings.yaml: |
        ---
        title: My Homelab
        theme: dark
        color: slate

        useEqualHeights: true
        statusStyle: "dot"
        headerStyle: boxed
        language: fr
        hideVersion: true
        disableCollapse: true

        background:
          # image: https://images.unsplash.com/photo-1740568439805-b610a1115fc3?q=80&w=3264&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D?auto=format&fit=crop&w=2560&q=80
          image: https://images.unsplash.com/photo-1769863467291-23cf7902f686?q=80&w=1064&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D
          blur: sm
          saturate: 50
          brightness: 50
          opacity: 50

        layout:

          # === MAIN TAB ===

          Home:
            tab: Main
            style: row
            columns: 4

          Media-consumption:
            tab: Main
            header: false
            style: row
            columns: 2
            Media:
              style: row
              columns: 2
            Books:
              style: row
              columns: 2

          Books:
            tab: Main
            header: true
            style: row
            columns: 2

          Torrenting:
            tab: Main
            header: false
            style: row
            columns: 2
            Media-management:
              header: true
              style: row
              columns: 1
              Download-management:
                style: row
                columns: 2
                header: false
              Torrent:
                style: row
                columns: 1
                header: false
            Calendar:
              header: true
              style: row
              columns: 1

          Tools and stuff:
            tab: Main
            header: true
            style: row
            columns: 3

          # === ADMIN TAB ===

          Infrastructure:
            tab: Admin
            header: true
            style: row
            columns: 3

          Monitoring:
            tab: Admin
            header: true
            style: row
            columns: 3

          DevTools:
            tab: Admin
            header: true
            style: row
            columns: 4

          Traefik:
            tab: Admin
            header: true
            style: row
            columns: 3

          Admin-bottom:
            tab: Admin
            header: false
            style: row
            columns: 2
            Backup:
              header: true
              style: row
              columns: 2
            Network:
              header: true
              style: row
              columns: 2

          # === PAPER WORK TAB ===

          Paper-work:
            tab: Paper work
            header: true
            style: row
            columns: 2
      services.yaml: |
        ---

        ################
        # Main tab
        ################

        - Home:
          - Home Assistant:
              icon: home-assistant.png
              href: http://ha.home
              description: Home Assistant
              ping: http://ha.home
          - Mealie:
              icon: mealie.png
              href: https://meal.autostack.ovh
              description: Gestion de recettes
              ping: https://meal.autostack.ovh
              widget:
                type: mealie
                url: http://mealie.mealie.svc.cluster.local:9000
                key: {{HOMEPAGE_VAR_MEALIE_API_KEY}}
                version: 2
          - Immich:
              icon: immich.png
              href: https://photo.autostack.ovh
              description: Gestion de photos
              ping: https://photo.autostack.ovh
              widget:
                type: immich
                url: https://photo.autostack.ovh
                key: {{HOMEPAGE_VAR_IMMICH_API_KEY}}
                version: 2

        - Media-consumption:
          - Media:
            - jellyfin:
                icon: jellyfin.png
                href: http://jellyflix.home
                description: Jellyfin
                ping: http://jellyflix.home
                widget:
                  type: jellyfin
                  url: http://jellyflix.home
                  key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
                  version: 2
                  # enableMediaControl: false
            - Seer:
                icon: seerr.png
                href: https://seer.autostack.ovh
                description: Demande de films et series
                ping: https://seer.autostack.ovh
                widget:
                  type: seerr
                  url: http://seerr.seerr.svc.cluster.local:5055
                  key: {{HOMEPAGE_VAR_SEERR_API_KEY}}

          - Books:
            - Calibre:
                icon: calibre.png
                href: http://calibre.home
                description: Gestionnaire de livres
                ping: http://calibre.home
                widget:
                  type: calibreweb
                  url: http://calibre.home
                  username: {{HOMEPAGE_VAR_CALIBRE_USER}}
                  password: {{HOMEPAGE_VAR_CALIBRE_PASS}}
            - Calibre maman:
                icon: calibre.png
                href: http://calibre-maman.home
                description: Gestionnaire de livres
                ping: http://calibre-maman.home
                widget:
                  type: calibreweb
                  url: http://calibre-maman.home
                  username: {{HOMEPAGE_VAR_CALIBRE_USER}}
                  password: {{HOMEPAGE_VAR_CALIBRE_PASS}}
