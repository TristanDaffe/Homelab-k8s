      bookmarks.yaml: |
        # https://tinyauth.app/docs/about
        # https://pocket-id.org/docs
      widgets.yaml: |
        ---

        - datetime:
            text_size: xl
            format:
              timeStyle: short
              hourCycle: h23

        - search:
            provider: google
            target: _blank
