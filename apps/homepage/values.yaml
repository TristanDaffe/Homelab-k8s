                icon: https://developer.asustor.com/uploadIcons/0020_999_1573465183_calibre-web_256.png
                href: https://shelfmark.autostack.ovh
                description: Téléchargement de livres
                ping: https://shelfmark.autostack.ovh
            - Téléchargement de livres maman:
                icon: https://developer.asustor.com/uploadIcons/0020_999_1573465183_calibre-web_256.png
                href: https://shelfmark-maman.autostack.ovh
                description: Téléchargement de livres
                ping: https://shelfmark-maman.autostack.ovh

        - Torrenting:
          - Media-management:
            - Download-management:
              - Radarr:
                  icon: radarr.png
                  href: https://arr.autostack.ovh/radarr
                  description: Téléchargement de films
                  ping: https://arr.autostack.ovh/radarr
                  widget:
                    type: radarr
                    url: http://radarr.media-management.svc.cluster.local:7878/radarr
                    key: {{HOMEPAGE_VAR_RADARR_API_KEY}}
              - Sonarr:
                  icon: sonarr.png
                  href: https://arr.autostack.ovh/sonarr
                  description: Téléchargement de séries
                  ping: https://arr.autostack.ovh/sonarr
                  widget:
                    type: sonarr
                    url: http://sonarr.media-management.svc.cluster.local:8989/sonarr
                    key: {{HOMEPAGE_VAR_SONARR_API_KEY}}
              - Bazarr:
                  icon: bazarr.png
                  href: https://arr.autostack.ovh/bazarr
                  description: Téléchargement de sous-titres
                  ping: https://arr.autostack.ovh/bazarr
                  widget:
                    type: bazarr
                    url: http://bazarr.media-management.svc.cluster.local:6767/bazarr
                    key: {{HOMEPAGE_VAR_BAZARR_API_KEY}}
              - Prowlarr:
                  icon: prowlarr.png
                  href: https://arr.autostack.ovh/prowlarr
                  description: Gestion des indexeurs
                  ping: https://arr.autostack.ovh/prowlarr
                  widget:
                    type: prowlarr
                    url: http://prowlarr.media-management.svc.cluster.local:9696/prowlarr
                    key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}
            - Torrent:
              - qBittorrent:
                  icon: qbittorrent.png
                  href: https://qbit.autostack.ovh
                  description: Téléchargement de torrents
                  ping: https://qbit.autostack.ovh
                  widget:
                    type: qbittorrent
                    url: http://qbittorrent.media-management.svc.cluster.local:8080
                    username: {{HOMEPAGE_VAR_QBIT_USER}}
                    password: {{HOMEPAGE_VAR_QBIT_PASS}}
                    enableLeechProgress: true
          - Calendar:
            - Calendar:
                widget:
                  type: calendar
                  view: monthly
                  maxEvents: 10
                  showTime: true
                  timezone: Europe/Brussels
                  integrations:
                    - type: sonarr
                      service_group: Download-management
                      service_name: Sonarr
                      color: teal
                      baseUrl: https://arr.autostack.ovh/sonarr
                    - type: radarr
                      service_group: Download-management
                      service_name: Radarr
                      color: red
                      baseUrl: https://arr.autostack.ovh/radarr

        - Tools and stuff:
          - ItTools:
              icon: it-tools.png
              href: https://it-tools.autostack.ovh
              description: Outils divers pour l'IT
              ping: https://it-tools.autostack.ovh

        ################
        # Admin tab
        ################

        - Infrastructure:
          - Proxmox:
              icon: proxmox.png
              href: https://192.168.129.110:8006
              description: Proxmox
              ping: https://192.168.129.110:8006
          - Portainer:
              icon: portainer.png
              href: https://portainer.autostack.ovh
              description: Portainer
              ping: https://portainer.autostack.ovh
