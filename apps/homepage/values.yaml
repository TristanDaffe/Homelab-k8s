              ping: https://traefik.master.autostack.ovh
              widget:
                type: traefik
                url: https://traefik.master.autostack.ovh
          - Traefik Media:
              icon: traefik.png
              href: https://traefik.media.autostack.ovh
              description: Traefik - media
              ping: https://traefik.media.autostack.ovh
