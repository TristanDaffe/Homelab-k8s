# Pocket ID, the OIDC provider of every app (in the cluster and on the Docker
# hosts), at its final name pocket-id.autostack.ovh (its issuer URL is baked
# into every OIDC client, so it never goes through *.kube). Data (SQLite +
# OIDC signing keys in keys/) migrated from Master /docker/volumes/pocket-id.
# DNS: a dedicated record pocket-id.autostack.ovh -> 192.168.129.139 (the
# zone's wildcard points at Master). TLS: its own Let's Encrypt certificate.
controllers:
  pocket-id:
    # 0 until the data is copied in (final app batch)
    replicas: 0
    containers:
      app:
        image:
          repository: ghcr.io/pocket-id/pocket-id
          tag: v2.19
        # As on Master: run the binary directly (the data is owned by 65532)
        command: [/app/pocket-id]
        env:
          APP_URL: https://pocket-id.autostack.ovh
          TRUST_PROXY: "true"
        envFrom:
          - secretRef:
              name: pocket-id
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

defaultPodOptions:
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: pocket-id
    ports:
      http:
        port: 1411

ingress:
  app:
    className: traefik
    hosts:
      - host: pocket-id.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts: [pocket-id.autostack.ovh]
        secretName: pocket-id-tls

persistence:
  data:
    type: persistentVolumeClaim
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/data

externalSecrets:
  app:
    forceRename: pocket-id
    secretStoreRef:
      kind: ClusterSecretStore
      name: infisical
    target:
      name: pocket-id
    data:
      - secretKey: ENCRYPTION_KEY
        remoteRef:
          key: /pocket-id/ENCRYPTION_KEY

rawResources:
  certificate:
    forceRename: pocket-id
    manifest:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      spec:
        secretName: pocket-id-tls
        dnsNames: [pocket-id.autostack.ovh]
        issuerRef:
          kind: ClusterIssuer
          # Tested on letsencrypt-staging first (project rule)
          name: letsencrypt-prod
