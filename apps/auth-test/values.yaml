# Throwaway app to test TinyAuth's forwardAuth Middleware. Remove once the
# login through Pocket ID is confirmed.
controllers:
  auth-test:
    containers:
      app:
        image:
          repository: traefik/whoami
          tag: v1.12.0
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        probes:
          liveness: {enabled: true}
          readiness: {enabled: true}

service:
  app:
    controller: auth-test
    ports:
      http:
        port: 80

ingress:
  app:
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: tinyauth-media-forwardauth@kubernetescrd
    hosts:
      - host: auth-test.kube.autostack.ovh
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
