# SMB account for the NAS share (Infisical folder /nas), used by the
# nas-media StorageClass of csi-driver-smb. Keys as the driver expects them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-smb-credentials
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: nas-smb-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /nas/SMB_USERNAME
    - secretKey: password
      remoteRef:
        key: /nas/SMB_PASSWORD
