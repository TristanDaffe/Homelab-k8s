# OVH API key of cert-manager's DNS-01 webhook (Infisical folder /cert-manager).
# Same Secret name and keys the ClusterIssuers already reference.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ovh-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ovh-credentials
    creationPolicy: Owner
  data:
    - secretKey: applicationKey
      remoteRef:
        key: /cert-manager/OVH_APPLICATION_KEY
    - secretKey: applicationSecret
      remoteRef:
        key: /cert-manager/OVH_APPLICATION_SECRET
    - secretKey: applicationConsumerKey
      remoteRef:
        key: /cert-manager/OVH_CONSUMER_KEY
