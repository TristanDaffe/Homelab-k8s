# Infisical project "homelab-k8s", environment "prod". One folder per consumer
# (e.g. /cert-manager); ExternalSecrets reference absolute keys like
# /cert-manager/OVH_APPLICATION_KEY.
# Login: machine identity "k3s-external-secrets" (Universal Auth, Viewer on the
# project). Its client ID/secret are in Secret external-secrets/infisical-universal-auth,
# created from SOPS (infisical_k8s) by the Homelab-infra argocd role.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://pass.autostack.ovh
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homelab-k8s
        environmentSlug: prod
        secretsPath: /
