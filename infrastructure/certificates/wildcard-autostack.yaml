# Wildcard for the final app names (*.autostack.ovh, plus *.tools.autostack.ovh
# for it.tools), also covering the transitional *.kube names. Traefik's
# default certificate (tlsstore.yaml). Pocket ID has its own certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-autostack-ovh
  namespace: kube-system
spec:
  secretName: wildcard-autostack-ovh-tls
  dnsNames:
    - "*.autostack.ovh"
    - "*.tools.autostack.ovh"
    # kube.autostack.ovh itself is covered by *.autostack.ovh (listing it is
    # rejected as redundant)
    - "*.kube.autostack.ovh"
  issuerRef:
    kind: ClusterIssuer
    # Tested on letsencrypt-staging first (project rule)
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
