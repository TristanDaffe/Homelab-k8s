# One wildcard certificate for every app under *.kube.autostack.ovh, served by
# Traefik as its default certificate (tlsstore.yaml): ingresses need no TLS
# section of their own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-kube-autostack-ovh
  namespace: kube-system
spec:
  secretName: wildcard-kube-autostack-ovh-tls
  dnsNames:
    - "*.kube.autostack.ovh"
    - kube.autostack.ovh
  issuerRef:
    kind: ClusterIssuer
    # Proven with letsencrypt-staging first; use staging again to test changes
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
