# Overrides for the Traefik that k3s installs (HelmChart kube-system/traefik;
# k3s v1.37 bundles chart traefik 41.6.x). Keys: https://github.com/traefik/traefik-helm-chart
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # kube-vip gives the LoadBalancer Service the ingress floating IP;
    # *.kube.autostack.ovh points there
    service:
      annotations:
        kube-vip.io/loadbalancerIPs: 192.168.129.139

    # Every plain-HTTP request is redirected to HTTPS (permanent)
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

    # Lets an app's Ingress use a Middleware from another namespace, e.g.
    #   traefik.ingress.kubernetes.io/router.middlewares: tinyauth-forwardauth@kubernetescrd
    # (TinyAuth's forwardAuth lives in its own namespace)
    providers:
      kubernetesCRD:
        allowCrossNamespace: true

    # Two replicas on different nodes: the ingress survives a node failure
    # (the floating IP moves, and a Traefik pod is already running elsewhere)
    deployment:
      replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
    # Node drains (upgrades, reboots) keep at least one Traefik running
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
