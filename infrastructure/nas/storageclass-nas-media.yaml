# The NAS media folder //192.168.129.45/Tristan/mac-mini (the LXCs' /media:
# media/{downloads,movies,tvseries}, books, ...), for every app that needs it.
#
# Every PVC of this class, in any namespace, mounts this SAME existing folder
# (fixed subDir). Downloads and libraries live in one mount, so hardlinks and
# atomic moves between them keep working. The controller mounts the share when
# a PVC is created (mkdir -p subDir, a no-op since mac-mini exists), so it needs
# the provisioner secret too; onDelete: retain + Retain mean nothing is ever
# deleted on the NAS when a PVC/PV goes away.
#
# Never put SQLite or other databases on it (CIFS locking): app configs stay on
# Longhorn.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-media
  annotations:
    # StorageClass parameters are immutable: Force+Replace makes Argo CD delete
    # and recreate it when they change (Replace alone is still an update and is
    # rejected). Existing PVs keep working: they copy what they need.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
provisioner: smb.csi.k8s.io
parameters:
  source: //192.168.129.45/Tristan
  subDir: mac-mini
  onDelete: retain
  # Credentials: Secret kube-system/nas-smb-credentials (External Secrets,
  # Infisical /nas/SMB_USERNAME + SMB_PASSWORD)
  csi.storage.k8s.io/provisioner-secret-name: nas-smb-credentials
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  csi.storage.k8s.io/node-stage-secret-name: nas-smb-credentials
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
# Same as the Proxmox host's CIFS mount, but owned by 1000:1000 (the apps'
# PUID/PGID) instead of the LXC-shifted 101000:101001
mountOptions:
  - vers=3.1.1
  - uid=1000
  - gid=1000
  - file_mode=0775
  - dir_mode=0775
  - nobrl
  - noperm
