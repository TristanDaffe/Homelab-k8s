# cert-manager (chart jetstack/cert-manager)
crds:
  enabled: true
  # Keep the CRDs (and so every Certificate) if the chart is ever removed
  keep: true

# Check DNS-01 TXT records against public resolvers: the cluster's upstream is
# the LAN Pi-hole, whose cache would hide the freshly created record
dns01RecursiveNameservers: "1.1.1.1:53,9.9.9.9:53"
dns01RecursiveNameserversOnly: true

resources:
  requests: {cpu: 10m, memory: 64Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
