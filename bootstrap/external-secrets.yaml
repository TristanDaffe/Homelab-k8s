# Secrets from Infisical, see infrastructure/external-secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/infrastructure/external-secrets/values.yaml
    - repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
