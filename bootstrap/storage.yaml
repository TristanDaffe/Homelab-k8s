# Extra StorageClasses (longhorn-single) and local-path no longer default,
# see infrastructure/storage
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
    targetRevision: main
    path: infrastructure/storage
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
