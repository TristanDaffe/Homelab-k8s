# Argo CD managing its own installation (chart + infrastructure/argocd/values.yaml)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.18.0
      helm:
        # Same release name as the Ansible bootstrap, so resource names match
        releaseName: argocd
        valueFiles:
          - $values/infrastructure/argocd/values.yaml
    - repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
