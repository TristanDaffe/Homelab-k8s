# OVH DNS-01 solver + ClusterIssuers, see infrastructure/cert-manager-webhook-ovh.
# Needs cert-manager's CRDs: retries until the cert-manager app has installed them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-ovh
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://aureq.github.io/cert-manager-webhook-ovh/
      chart: cert-manager-webhook-ovh
      targetRevision: 0.9.19
      helm:
        releaseName: cert-manager-webhook-ovh
        valueFiles:
          - $values/infrastructure/cert-manager-webhook-ovh/values.yaml
    - repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
