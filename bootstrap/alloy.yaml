# Alloy DaemonSet: ships the k3s pods' logs to Loki. See infrastructure/alloy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/infrastructure/alloy/values.yaml
    - repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
