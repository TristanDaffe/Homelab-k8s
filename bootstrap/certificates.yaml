# Wildcard *.kube.autostack.ovh + Traefik default certificate, see
# infrastructure/certificates. Retries until cert-manager's CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: certificates
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
    targetRevision: main
    path: infrastructure/certificates
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
