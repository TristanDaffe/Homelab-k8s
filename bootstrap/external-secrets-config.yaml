# ClusterSecretStore "infisical" + ExternalSecrets for cluster add-ons, see
# infrastructure/external-secrets-config. Retries until the CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@git.autostack.ovh:222/Susu/Homelab-k8S.git
    targetRevision: main
    path: infrastructure/external-secrets-config
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
